<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de CURP - Meyra Yañez Osorio</title>
    <style>
        /* Estilo para el fondo y contenedor */
        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .documento-container {
            background-color: #ffffff;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 90%;
            border-radius: 4px;
        }

        /* Estilo de la imagen */
        .curp-img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 800px; /* Tamaño estándar de una hoja */
            border: 1px solid #ccc;
        }

        .info-pie {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="documento-container">
        <img src="curp-documento.png" 
             alt="Constancia de la Clave Única de Registro de Población" 
             class="curp-img">
        
        <div class="info-pie">
            Documento de Identidad: YAOM080604MMCXSYA1
        </div>
    </div>

</body>
</html>
